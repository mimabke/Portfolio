<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oumaima Boukhalfa — Data Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noir: #0b0b0c;
    --noir-2: #141416;
    --blanc: #f6f3ee;
    --blanc-2: #ffffff;
    --gris: #8d8880;
    --gris-fonce: #4d4a45;
    --bordeaux: #7a1128;
    --bordeaux-clair: #b23a4e;
    --bordeaux-vif: #9c1f34;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--noir);
    color:var(--blanc);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--bordeaux); color:var(--blanc-2); }

  a{ color:inherit; text-decoration:none; }

  /* ---------- custom cursor ---------- */
  #cursor-dot{
    position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
    background:var(--bordeaux-clair); pointer-events:none; z-index:999;
    transform:translate(-50%,-50%); mix-blend-mode:difference;
    transition:width .25s ease, height .25s ease, background .25s ease;
  }
  #cursor-ring{
    position:fixed; top:0; left:0; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--bordeaux-clair); pointer-events:none; z-index:998;
    transform:translate(-50%,-50%); transition: width .3s ease, height .3s ease, opacity .3s ease;
  }
  @media (pointer:coarse){ #cursor-dot, #cursor-ring{ display:none; } }

  /* ---------- layout shells ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:0 6vw; }
  section{ position:relative; padding:120px 0; }
  @media (max-width:760px){ section{ padding:80px 0; } .wrap{ padding:0 7vw; } }

  .eyebrow-label{
    font-family:var(--sans); font-size:13px; letter-spacing:.04em; color:var(--bordeaux-clair);
  }

  /* ---------- side nav ---------- */
  #sidenav{
    position:fixed; top:0; left:0; height:100vh; width:88px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:36px 0; z-index:50; mix-blend-mode:normal;
  }
  #sidenav .brand{
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:var(--serif); font-size:15px; letter-spacing:.08em; color:var(--gris);
  }
  #sidenav .dots{ display:flex; flex-direction:column; gap:22px; }
  .navdot{
    width:9px; height:9px; border-radius:50%; background:transparent; border:1px solid var(--gris-fonce);
    cursor:pointer; transition:all .4s cubic-bezier(.2,.8,.2,1); position:relative;
  }
  .navdot.active{ background:var(--bordeaux-clair); border-color:var(--bordeaux-clair); transform:scale(1.5); }
  .navdot .navlabel{
    position:absolute; left:20px; top:50%; transform:translateY(-50%) translateX(-6px);
    white-space:nowrap; font-size:11px; letter-spacing:.06em; color:var(--gris);
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none;
  }
  .navdot:hover .navlabel{ opacity:1; transform:translateY(-50%) translateX(0); }
  #sidenav .scrollline{ width:1px; height:70px; background:linear-gradient(var(--gris-fonce), transparent); }
  @media (max-width:900px){ #sidenav{ display:none; } }

  .content-shift{ margin-left:88px; }
  @media (max-width:900px){ .content-shift{ margin-left:0; } }

  /* ---------- reveal utility ---------- */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in{ opacity:1; transform:translateY(0); }
  .reveal-delay-1.in{ transition-delay:.08s; }
  .reveal-delay-2.in{ transition-delay:.16s; }
  .reveal-delay-3.in{ transition-delay:.24s; }
  .reveal-delay-4.in{ transition-delay:.32s; }

  /* ---------- hero ---------- */
  #hero{ min-height:10vh; font-style:italic; display:flex; flex-direction:column; justify-content:center; padding-top:80px; padding-bottom:0; }
  .hero-grid{ display:grid;  grid-template-columns:1.5fr 1fr; gap:20px; align-items:end; }
  @media (max-width:1400px){ .hero-grid{ grid-template-columns:1fr; } }

  .hero-name{
    font-family:var(--serif);  line-height:.48;
    font-size:clamp(36px, 9vw, 56px); margin:14px 0 0 0; letter-spacing:-.01em;
  }
  .hero-name .line{ overflow:hidden; display:block; }
  .hero-name .line span{
    display:inline-block; transform:translateY(110%);
    animation:riseUp .9s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes riseUp{ to{ transform:translateY(0); } }

  .hero-italic{ font-style:italic; color:var(--bordeaux-clair); }
  .hero-function{
    font-family:var(--serif); font-style:italic; color:var(--bordeaux-clair); font-weight:400;
    font-size:clamp(30px, 5vw, 66px); line-height:1.05; letter-spacing:-.01em; display:block;
  }
height
  .hero-sub{ font-size:16px; color:var(--gris); max-width:64ch; line-:1.6; margin-top:26px; text-align: center; }
  .hero-meta{ display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:34px; margin-bottom:12px; font-size:13px; }
  .hero-meta a:hover{ color:var(--bordeaux-clair); }

  .hero-scroll{
    position:absolute; bottom:38px; left:0; right:0; display:flex; justify-content:center;
    font-size:11px; letter-spacing:.14em; color:var(--gris); gap:10px; align-items:center;
  }
  .hero-scroll .bar{ width:1px; height:34px; background:var(--gris-fonce); overflow:hidden; position:relative; }
  .hero-scroll .bar::after{
    content:''; position:absolute; top:-100%; left:0; width:100%; height:100%; background:var(--bordeaux-clair);
    animation:scrollbar 1.8s ease-in-out infinite;
  }
  @keyframes scrollbar{ 0%{ top:-100%; } 50%{ top:0; } 100%{ top:100%; } }

  /* ---------- marquee ---------- */
  .marquee-band{
    background:var(--bordeaux); transform:rotate(-1.2deg); margin:0 -8vw; padding:16px 0;
    overflow:hidden; white-space:nowrap;
  }
  .marquee-track{ display:inline-flex; animation:marquee 26s linear infinite; }
  .marquee-track span{
    font-family:var(--serif); font-style:italic; font-size:22px; color:var(--blanc-2);
    padding:0 28px; display:inline-flex; align-items:center; gap:28px;
  }
  .marquee-track span::after{ content:'✦'; font-style:normal; font-size:13px; color:rgba(255,255,255,.55); }
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .marquee-track{ animation-duration:70s; } }

  /* ---------- section titles ---------- */
  .sec-head{ display:flex; align-items:baseline; gap:18px; margin-bottom:18px; }
  .sec-num{ font-family:var(--serif); font-style:italic; color:var(--bordeaux-clair); font-size:15px; }
  .sec-title{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4vw,46px); }
  .sec-rule{ flex:1; height:1px; background:var(--gris-fonce); margin-left:8px; }

  /* ---------- profil ---------- */
  #profil .lede{ font-family:var(--serif); font-size:20px; text-align: justify; line-height:1.5; max-width:30ch; }
  #profil .lede em{ color:var(--bordeaux-clair); font-style:italic; }
  .profil-flex{ display:grid; grid-template-columns:.85fr 1.3fr 1fr; gap:20px; }
  @media (max-width:1000px){ .profil-flex{ grid-template-columns:1fr; gap:18px; } }

  .photo-col{ display:flex; flex-direction:column; align-items:flex-start; gap:16px; }
  .photo-frame{
    position:relative; width:190px; height:190px; border-radius:50%; flex:none;
  }
  .photo-frame::before{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--bordeaux), transparent 30%, var(--bordeaux-clair), transparent 70%, var(--bordeaux));
    animation:spinRing 7s linear infinite;
  }
  @keyframes spinRing{ to{ transform:rotate(360deg); } }
  .photo-inner{
    position:absolute; inset:6px; border-radius:50%; overflow:hidden;
    background:linear-gradient(160deg, var(--noir-2), var(--noir));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-style:italic; font-size:52px; color:var(--bordeaux-clair);
  }
  .photo-inner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-caption{ font-size:12px; color:var(--gris-fonce); max-width:22ch; line-height:1.5; }
  @media (prefers-reduced-motion: reduce){ .photo-frame::before{ animation:none; } }
  .profil-side p{  font-size:15px; line-height:1.75; text-align: justify; }
  .qualites-list{ list-style:none; padding:0; margin:20px 0 0 0; display:grid; gap:10px; }
  .qualites-list li{
    font-size:13px; color:var(--blanc); border-left:2px solid var(--bordeaux); padding-left:12px;
    transform:translateX(-8px); opacity:0; transition:all .5s ease;
  }
  .qualites-list li.in{ transform:translateX(0); opacity:1; }

  /* ---------- experience timeline ---------- */
  .timeline{ position:relative; }
  .timeline::before{
    content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1px; background:var(--gris-fonce);
  }
  .timeline-fill{
    position:absolute; left:9px; top:6px; width:1px; background:var(--bordeaux-clair);
    height:0%; transition:height .3s linear;
  }
  .tl-item{ position:relative; padding-left:46px; margin-bottom:64px; }
  .tl-item:last-child{ margin-bottom:0; }
  .tl-dot{
    position:absolute; left:2px; top:6px; width:17px; height:17px; border-radius:50%;
    background:var(--noir); border:1px solid var(--gris-fonce); transition:all .5s ease;
  }
  .tl-item.in .tl-dot{ border-color:var(--bordeaux-clair); background:var(--bordeaux); box-shadow:0 0 0 4px rgba(122,17,40,.25); }
  .tl-date{ font-size:12px; letter-spacing:.05em; color:var(--bordeaux-clair); font-family:var(--sans); }
  .tl-role{ font-family:var(--serif); font-size:24px; margin:6px 0 2px 0; }
  .tl-org{ color:var(--gris); font-size:14px; margin-bottom:16px; }
  .tl-item ul{ margin:0; padding:0; list-style:none; display:grid; gap:10px; max-width:60ch; }
  .tl-item ul li{ font-size:14.5px; color:#cfcac2; line-height:1.6; padding-left:18px; position:relative; }
  .tl-item ul li::before{ content:'—'; position:absolute; left:0; color:var(--gris-fonce); }

  /* ---------- formation ---------- */
  .formation-grid{ display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start; }
  @media (max-width:760px){ .formation-grid{ grid-template-columns:1fr; } }
  .formation-card{
    border:1px solid var(--gris-fonce); padding:30px; cursor:pointer; text-align:left; width:100%;
    background:none; color:inherit; font-family:inherit; transition:border-color .4s ease, transform .4s ease, background .4s ease;
  }
  .formation-card:hover{ border-color:var(--bordeaux-clair); transform:translateY(-6px); background:var(--noir-2); }
  .formation-card.expanded{ border-color:var(--bordeaux-clair); background:var(--noir-2); }
  .fc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .formation-card .fc-date{ font-size:12px; color:var(--bordeaux-clair); }
  .formation-card h3{ font-family:var(--serif); font-weight:400; font-size:21px; margin:10px 0 4px; }
  .formation-card p{ color:var(--gris); font-size:14px; margin:0; }
  .fc-chevron{
    flex:none; width:22px; height:22px; border:1px solid var(--gris-fonce); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--bordeaux-clair);
    transition:transform .4s cubic-bezier(.2,.7,.2,1), border-color .3s ease;
  }
  .formation-card.expanded .fc-chevron{ transform:rotate(135deg); border-color:var(--bordeaux-clair); }
  .fc-details{
    max-height:0; overflow:hidden; transition:max-height .5s cubic-bezier(.2,.7,.2,1), opacity .4s ease, margin-top .4s ease;
    opacity:0; margin-top:0;
  }
  .formation-card.expanded .fc-details{ max-height:220px; opacity:1; margin-top:18px; }
  .fc-details-inner{ border-top:1px solid var(--gris-fonce); padding-top:16px; }
  .fc-details-inner p{ color:#cfcac2; font-size:13.5px; line-height:1.7; margin:0 0 14px 0; }
  .fc-school-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--bordeaux-clair);
    border-bottom:1px solid var(--bordeaux-clair); padding-bottom:2px; transition:gap .3s ease;
  }
  .fc-school-link:hover{ gap:12px; }
  .certs{ margin-top:34px; display:grid; gap:8px; }
  .cert-row{ display:flex; gap:12px; font-size:13.5px; color:var(--gris); align-items:flex-start; }
  .cert-row .dash{ color:var(--bordeaux-clair); }

  /* ---------- competences ---------- */
  .skills-block{ margin-bottom:38px; }
  .skills-block:last-child{ margin-bottom:0; }
  .skills-block h4{
    font-family:var(--sans); font-size:12px; letter-spacing:.05em; color:var(--gris); font-weight:500; margin:0 0 16px 0;
  }
  .tag-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .tag{
    border:1px solid var(--gris-fonce); padding:9px 16px; font-size:13.5px; border-radius:2px;
    opacity:0; transform:translateY(10px) scale(.96); transition:opacity .5s ease, transform .5s ease, border-color .3s ease, background .3s ease, color .3s ease;
    cursor:default;
  }
  .tag.in{ opacity:1; transform:translateY(0) scale(1); }
  .tag:hover{ background:var(--bordeaux); border-color:var(--bordeaux); color:var(--blanc-2); transform:translateY(-3px) rotate(-1deg); }

  /* ---------- savoir-faire (cartes) ---------- */
  .sf-heading{ margin:64px 0 30px; display:flex; align-items:baseline; gap:14px; }
  .sf-heading h4{ font-family:var(--serif); font-style:italic; font-size:22px; color:var(--blanc); font-weight:400; margin:0; }
  .sf-heading span{ font-size:12px; color:var(--gris-fonce); }
  .sf-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  @media (max-width:980px){ .sf-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:640px){ .sf-grid{ grid-template-columns:1fr; } }
  .sf-card{
    border:1px solid var(--gris-fonce); padding:26px; display:flex; flex-direction:column; gap:16px;
    transition:transform .45s cubic-bezier(.2,.7,.2,1), border-color .4s ease, background .4s ease;
  }
  .sf-card:hover{ transform:translateY(-8px) rotate(-.4deg); border-color:var(--bordeaux-clair); background:var(--noir-2); }
  .sf-photo{
    width:52px; height:52px; border-radius:50%; flex:none; overflow:hidden;
    background:linear-gradient(160deg, var(--bordeaux), var(--noir-2));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-style:italic; color:var(--blanc-2); font-size:18px;
  }
  .sf-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sf-card h5{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0; }
  .sf-card p{ font-size:13.5px; color:var(--gris); line-height:1.65; margin:0; }

    /* ---------- langues ---------- */
  .langues-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  @media (max-width:700px){ .langues-grid{ grid-template-columns:repeat(2,1fr); } }
  .langue-item{ text-align:left; padding:22px 0; border-top:1px solid var(--gris-fonce); }
  .langue-item .lg-name{ font-family:var(--serif); font-size:22px; }
  .langue-item .lg-level{ font-size:12px; color:var(--bordeaux-clair); margin-top:4px; }
  .langue-item .lg-bar{ height:2px; background:var(--gris-fonce); margin-top:14px; overflow:hidden; }
  .langue-item .lg-bar > i{ display:block; height:100%; background:var(--bordeaux-clair); width:0%; transition:width 1.1s cubic-bezier(.2,.7,.2,1); }
  .langue-item.in .lg-bar > i{ width:var(--w); }

  /* ---------- testimonials ---------- */
  .test-band{ overflow:hidden; margin:0 -6vw; padding:10px 0 30px; position:relative; }
  .test-band::before, .test-band::after{
    content:''; position:absolute; top:0; bottom:0; width:80px; z-index:2; pointer-events:none;
  }
  .test-band::before{ left:0; background:linear-gradient(90deg, var(--noir), transparent); }
  .test-band::after{ right:0; background:linear-gradient(-90deg, var(--noir), transparent); }
  .test-track{
    display:flex; gap:24px; width:max-content;
    animation:testScroll 34s linear infinite;
    padding:0 6vw;
  }
  .test-track:hover{ animation-play-state:paused; }
  @keyframes testScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce){ .test-track{ animation-duration:90s; } }

  .test-card{
    flex:none; width:320px; border:1px solid var(--gris-fonce); padding:26px; background:var(--noir-2);
    transition:transform .4s ease, border-color .4s ease;
    display:flex; flex-direction:column; gap:18px;
  }
  .test-card:hover{ transform:translateY(-6px) rotate(-0.4deg); border-color:var(--bordeaux-clair); }
  .test-quote{ font-family:var(--serif); font-style:italic; font-size:16.5px; line-height:1.55; color:#e9e5df; }
  .test-quote::before{ content:'\201C'; color:var(--bordeaux-clair); font-size:26px; margin-right:2px; }
  .test-who{ display:flex; align-items:center; gap:12px; margin-top:auto; }
  .test-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--bordeaux); color:var(--blanc-2);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-family:var(--sans); font-weight:600; flex:none;
  }
  .test-name{ font-size:13.5px; color:var(--blanc); }
  .test-role{ font-size:12px; color:var(--gris); }
  .test-note{ font-size:12px; color:var(--gris-fonce); margin-top:-8px; }

  /* ---------- contact / footer ---------- */
  #contact{ text-align:left; }
  .contact-title{
    font-family:var(--serif); font-size:clamp(40px,7vw,92px); line-height:1.02; font-weight:400;
  }
  .contact-title .amp{ color:var(--bordeaux-clair); font-style:italic; }
  .contact-links{ display:flex; flex-wrap:wrap; gap:30px 46px; margin-top:44px; }
  .contact-link{ font-size:15px; padding-bottom:4px; border-bottom:1px solid var(--gris-fonce); position:relative; overflow:hidden; }
  .contact-link .under{
    position:absolute; left:0; bottom:-1px; height:1px; width:0%; background:var(--bordeaux-clair);
    transition:width .4s ease;
  }
  .contact-link:hover .under{ width:100%; }
  footer{ margin-top:120px; padding:28px 0; border-top:1px solid var(--gris-fonce); display:flex; justify-content:space-between; font-size:12px; color:var(--gris-fonce); flex-wrap:wrap; gap:10px; }

  @media (prefers-reduced-motion: reduce){
    .reveal, .tag, .qualites-list li{ transition:none !important; }
    .hero-name .line span{ animation:none !important; transform:translateY(0) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback} = React;

/* ---------- data ---------- */
const NAV = [
  {id:'hero', label:'Intro'},
  {id:'profil', label:'Profil'},
  {id:'experience', label:'Expérience'},
  {id:'formation', label:'Formation'},
  {id:'competences', label:'Compétences'},
  {id:'langues', label:'Langues'},
  {id:'temoignages', label:'Témoignages'},
  {id:'contact', label:'Contact'},
];


const EXPERIENCES = [
  {
    date:'Sept. 2024 — Juil. 2025',
    role:'Stage de fin d’études (PFE)',
    org:'KUR INSAAT, Alger — Conception d’un système de gestion des ressources de l’entreprise',
    bullets:[
      'Collecte, analyse et nettoyage des données dispersées issues des systèmes d’approvisionnement, de gestion des stocks et de suivi des projets.',
      'Collaboration avec les équipes métiers pour identifier les besoins en données et adapter les rapports BI.',
      'Création et implémentation de tableaux de bord dynamiques pour le pilotage des processus achats, inventaire et gestion de projet.',
      'Déploiement de solutions analytiques dans un environnement conteneurisé Docker pour la maintenance et la scalabilité.',
      'Automatisation de l’intégration de données externes via API REST pour garantir la cohérence et la fraîcheur des informations.'
    ]
  },
  {
    date:'Juil. 2023 — Sept. 2023',
    role:'Stage d’immersion professionnelle (SPE)',
    org:'KUR INSAAT, Alger — Extension HMUSORA, Bouchaoui : maintenance préventive et curative des dispositifs médicaux',
    bullets:[
      'Nettoyage et structuration de données d’équipements médicaux et techniques, réparties initialement dans des fichiers Excel hétérogènes.',
      'Migration et intégration des données dans une base de données SQL (MySQL) depuis Access.',
      'Conception de dashboards BI pour le suivi des équipements et l’aide à la décision en matière de maintenance.',

/* ---------- hook: reveal on scroll ---------- */
function useReveal(){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ setInView(true); obs.unobserve(e.target); } });
    }, {threshold:0.18});
    obs.observe(el);
    return ()=>obs.disconnect();
  },[]);
  return [ref, inView];
}

function Reveal({children, className='', delay=0, as='div'}){
  const [ref,inView] = useReveal();
  const Tag = as;
  const delayClass = delay ? `reveal-delay-${delay}` : '';
  return <Tag ref={ref} className={`reveal ${delayClass} ${inView?'in':''} ${className}`}>{children}</Tag>;
}

/* ---------- custom cursor ---------- */
function Cursor(){
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    let ringX=0, ringY=0, mx=0, my=0;
    const move = e=>{ mx=e.clientX; my=e.clientY; if(dotRef.current){ dotRef.current.style.left=mx+'px'; dotRef.current.style.top=my+'px'; } };
    window.addEventListener('mousemove', move);
    let raf;
    const loop = ()=>{
      ringX += (mx-ringX)*0.15; ringY += (my-ringY)*0.15;
      if(ringRef.current){ ringRef.current.style.left=ringX+'px'; ringRef.current.style.top=ringY+'px'; }
      raf = requestAnimationFrame(loop);
    };
    loop();
    return ()=>{ window.removeEventListener('mousemove',move); cancelAnimationFrame(raf); };
  },[]);
  return <>
    <div id="cursor-dot" ref={dotRef}></div>
    <div id="cursor-ring" ref={ringRef}></div>
  </>;
}

/* ---------- side nav with scrollspy ---------- */
function SideNav(){

    NAV.forEach(n=>{ const el=document.getElementById(n.id); if(el) obs.observe(el); });
    return ()=>obs.disconnect();
  },[]);
  return (
    <nav id="sidenav">
      <span className="brand"></span>
      <div className="dots">
        {NAV.map(n=>(
          <a key={n.id} href={`#${n.id}`} className={`navdot ${active===n.id?'active':''}`}>

    </nav>
  );
}

function Experience(){

  const onScroll = useCallback(()=>{
    if(!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const vh = window.innerHeight;
    const total = rect.height;
    const visible = Math.min(Math.max(vh*0.75 - rect.top, 0), total);
    setFillHeight((visible/total)*100);
  },[]);
  useEffect(()=>{
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
    return ()=>window.removeEventListener('scroll', onScroll);
  },[onScroll]);

  return (
    <section id="experience">
      <div className="wrap">
        <Reveal className="sec-head">
