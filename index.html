<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oumaima Boukhalfa — Data Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noir: #0b0b0c;
    --noir-2: #141416;
    --noir-3: #1b1b1e;
    --blanc: #f6f3ee;
    --blanc-2: #ffffff;
    --texte: #cfcac2;
    --gris: #8d8880;
    --gris-fonce: #4d4a45;
    --bordeaux: #7a1128;
    --bordeaux-clair: #b23a4e;
    --bordeaux-vif: #9c1f34;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--noir);
    color:var(--blanc);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--bordeaux); color:var(--blanc-2); }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid var(--bordeaux-clair); outline-offset:3px; }

  /* ---------- curseur ---------- */
  #cursor-dot{
    position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
    background:var(--bordeaux-clair); pointer-events:none; z-index:999;
    transform:translate(-50%,-50%); mix-blend-mode:difference;
    transition:width .25s ease, height .25s ease, background .25s ease;
  }
  #cursor-ring{
    position:fixed; top:0; left:0; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--bordeaux-clair); pointer-events:none; z-index:998;
    transform:translate(-50%,-50%); transition: width .3s ease, height .3s ease, background .3s ease;
  }
  /* le curseur grossit sur tout ce qui est cliquable */
  body.cursor-hover #cursor-ring{ width:60px; height:60px; background:rgba(178,58,78,.14); }
  body.cursor-hover #cursor-dot{ width:6px; height:6px; }
  @media (pointer:coarse){ #cursor-dot, #cursor-ring{ display:none; } }

  /* ---------- structure ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:0 6vw; }
  section{ position:relative; padding:120px 0; }
  @media (max-width:760px){ section{ padding:80px 0; } .wrap{ padding:0 7vw; } }

  .eyebrow-label{ font-family:var(--sans); font-size:13px; letter-spacing:.04em; color:var(--bordeaux-clair); }
  .sub-label{ font-family:var(--sans); font-size:13px; letter-spacing:.04em; color:var(--gris); font-weight:500; margin:0 0 16px 0; }

  /* ---------- navigation latérale ---------- */
  #sidenav{
    position:fixed; top:0; left:0; height:100vh; width:88px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:36px 0; z-index:50;
  }
  #sidenav .dots{ display:flex; flex-direction:column; gap:22px; }
  .navdot{
    width:9px; height:9px; border-radius:50%; background:transparent; border:1px solid var(--gris-fonce);
    cursor:pointer; transition:all .4s cubic-bezier(.2,.8,.2,1); position:relative;
  }
  .navdot.active{ background:var(--bordeaux-clair); border-color:var(--bordeaux-clair); transform:scale(1.5); }
  .navdot .navlabel{
    position:absolute; left:20px; top:50%; transform:translateY(-50%) translateX(-6px);
    white-space:nowrap; font-size:11px; letter-spacing:.06em; color:var(--gris);
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none;
  }
  .navdot:hover .navlabel, .navdot:focus-visible .navlabel{ opacity:1; transform:translateY(-50%) translateX(0); }
  #sidenav .scrollline{ width:1px; height:70px; background:linear-gradient(var(--gris-fonce), transparent); }
  @media (max-width:900px){ #sidenav{ display:none; } }

  .content-shift{ margin-left:88px; }
  @media (max-width:900px){ .content-shift{ margin-left:0; } }

  /* ---------- apparition au scroll ---------- */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .reveal-delay-1.in{ transition-delay:.08s; }
  .reveal-delay-2.in{ transition-delay:.16s; }
  .reveal-delay-3.in{ transition-delay:.24s; }
  .reveal-delay-4.in{ transition-delay:.32s; }

  /* ---------- hero ---------- */
  #hero{ font-style:italic; display:flex; flex-direction:column; justify-content:center; padding-top:80px; padding-bottom:40px; }
  .hero-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:end; }
  @media (max-width:1400px){ .hero-grid{ grid-template-columns:1fr; } }
  .hero-name{ font-family:var(--serif); line-height:.48; font-size:clamp(36px, 9vw, 56px); margin:14px 0 0 0; letter-spacing:-.01em; }
  .hero-name .line{ overflow:hidden; display:block; }
  .hero-name .line span{ display:inline-block; transform:translateY(110%); animation:riseUp .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes riseUp{ to{ transform:translateY(0); } }
  .hero-function{
    font-family:var(--serif); font-style:italic; color:var(--bordeaux-clair); font-weight:400;
    font-size:clamp(30px, 5vw, 66px); line-height:1.05; letter-spacing:-.01em; display:block;
  }
  .hero-sub{ font-size:16px; color:var(--texte); max-width:64ch; line-height:1.65; margin-top:26px; font-style:normal; }
  .hero-meta{ display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:30px; margin-bottom:12px; font-size:13px; font-style:normal; }
  .hero-meta a{ border-bottom:1px solid var(--gris-fonce); padding-bottom:2px; transition:color .3s ease, border-color .3s ease; }
  .hero-meta a:hover{ color:var(--bordeaux-clair); border-color:var(--bordeaux-clair); }
  .hero-meta span{ color:var(--gris); }

  /* ---------- bandeau défilant ---------- */
  .marquee-band{ background:var(--bordeaux); transform:rotate(-1.2deg); margin:0 -8vw; padding:16px 0; overflow:hidden; white-space:nowrap; }
  .marquee-track{ display:inline-flex; animation:marquee 26s linear infinite; }
  .marquee-track span{
    font-family:var(--serif); font-style:italic; font-size:22px; color:var(--blanc-2);
    padding:0 28px; display:inline-flex; align-items:center; gap:28px;
  }
  .marquee-track span::after{ content:'✦'; font-style:normal; font-size:13px; color:rgba(255,255,255,.55); }
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  /* ---------- titres de section ---------- */
  .sec-head{ display:flex; align-items:baseline; gap:18px; margin-bottom:48px; }
  .sec-num{ font-family:var(--serif); font-style:italic; color:var(--bordeaux-clair); font-size:15px; }
  .sec-title{ font-family:var(--serif); font-weight:400; font-size:clamp(30px,4vw,46px); margin:0; }
  .sec-rule{ flex:1; height:1px; background:var(--gris-fonce); margin-left:8px; }

  /* ---------- profil ---------- */
  .profil-grid{ display:grid; grid-template-columns:230px 1fr; gap:72px; align-items:start; }
  @media (max-width:860px){ .profil-grid{ grid-template-columns:1fr; gap:44px; } }

  .photo-col{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; position:sticky; top:48px; }
  @media (max-width:860px){ .photo-col{ position:static; } }
  .photo-frame{ position:relative; width:200px; height:200px; border-radius:50%; flex:none; }
  .photo-frame::before{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--bordeaux), transparent 30%, var(--bordeaux-clair), transparent 70%, var(--bordeaux));
    animation:spinRing 7s linear infinite;
  }
  @keyframes spinRing{ to{ transform:rotate(360deg); } }
  .photo-inner{
    position:absolute; inset:6px; border-radius:50%; overflow:hidden;
    background:linear-gradient(160deg, var(--noir-2), var(--noir));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-style:italic; font-size:52px; color:var(--bordeaux-clair);
  }
  .photo-inner img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; display:block; image-rendering:auto; }
  .photo-name{ font-family:var(--serif); font-size:22px; margin-top:6px; }
  .photo-loc{ font-size:13px; color:var(--gris); margin-top:4px; }
  .dispo{
    display:inline-flex; align-items:center; gap:9px; font-size:12.5px; color:var(--blanc);
    border:1px solid var(--bordeaux); background:rgba(122,17,40,.18); padding:8px 14px; border-radius:999px;
  }
  .dispo i{ width:7px; height:7px; border-radius:50%; background:var(--bordeaux-clair); box-shadow:0 0 0 0 rgba(178,58,78,.6); animation:pulse 2.2s ease-out infinite; }
  .badges{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .dispo.static i{ animation:none; background:var(--blanc); opacity:.7; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(178,58,78,.6); } 70%{ box-shadow:0 0 0 9px rgba(178,58,78,0); } 100%{ box-shadow:0 0 0 0 rgba(178,58,78,0); } }

  .profil-main .lede{
    font-family:var(--serif); font-size:clamp(18px,1.8vw,22px); line-height:1.45; font-weight:400;
    margin:0 0 24px 0; padding-left:20px; border-left:2px solid var(--bordeaux-clair); max-width:40ch;
  }
  .profil-hello{ font-family:var(--serif); font-size:clamp(28px,3.2vw,40px); line-height:1.15; font-weight:400; margin:0 0 20px 0; }
  .profil-hello em{ font-style:italic; color:var(--bordeaux-clair); }
  .profil-text{ font-size:14px; line-height:1.8; color:var(--texte); max-width:66ch; margin:0 0 16px 0; }
  .profil-text:last-child{ margin-bottom:36px; }
  .profil-text strong{ color:var(--blanc); font-weight:500; }
  .qualites-list{ list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(2,1fr); gap:12px 28px; }
  @media (max-width:520px){ .qualites-list{ grid-template-columns:1fr; } }
  .qualites-list li{
    font-size:14px; color:var(--blanc); border-left:2px solid var(--bordeaux); padding:3px 0 3px 12px;
    transform:translateX(-8px); opacity:0; transition:all .5s ease;
  }
  .qualites-list li.in{ transform:translateX(0); opacity:1; }

  /* ---------- expérience ---------- */
  .timeline{ position:relative; }
  .timeline::before{ content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1px; background:var(--gris-fonce); }
  .timeline-fill{ position:absolute; left:9px; top:6px; width:1px; background:var(--bordeaux-clair); height:0%; transition:height .3s linear; }
  .tl-item{ position:relative; padding-left:46px; margin-bottom:64px; }
  .tl-item:last-child{ margin-bottom:0; }
  .tl-dot{ position:absolute; left:2px; top:6px; width:17px; height:17px; border-radius:50%; background:var(--noir); border:1px solid var(--gris-fonce); transition:all .5s ease; }
  .tl-item.in .tl-dot{ border-color:var(--bordeaux-clair); background:var(--bordeaux); box-shadow:0 0 0 4px rgba(122,17,40,.25); }
  .tl-date{ font-size:12px; letter-spacing:.05em; color:var(--bordeaux-clair); }
  .tl-role{ font-family:var(--serif); font-size:24px; font-weight:400; margin:6px 0 2px 0; }
  .tl-org{ color:var(--gris); font-size:14px; margin-bottom:16px; }
  .tl-item ul{ margin:0; padding:0; list-style:none; display:grid; gap:10px; max-width:60ch; }
  .tl-item ul li{ font-size:14.5px; color:var(--texte); line-height:1.6; padding-left:18px; position:relative; }
  .tl-item ul li::before{ content:'—'; position:absolute; left:0; color:var(--gris-fonce); }

  /* ---------- boutons « plus d'infos » (partagés) ---------- */
  .more-btn{
    display:inline-flex; align-items:center; gap:10px; cursor:pointer;
    font-family:var(--sans); font-size:13px; color:var(--blanc);
    background:transparent; border:1px solid var(--bordeaux-clair); padding:10px 16px 10px 12px;
    transition:background .3s ease, border-color .3s ease;
  }
  .more-btn:hover{ background:var(--bordeaux); border-color:var(--bordeaux); }
  .more-ico{
    width:20px; height:20px; border-radius:50%; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--bordeaux-clair); color:var(--blanc-2); font-size:14px; line-height:1;
    transition:transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .is-open .more-ico{ transform:rotate(45deg); }
  .ext-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--bordeaux-clair);
    border-bottom:1px solid var(--bordeaux-clair); padding-bottom:2px;
  }
  .ext-link svg{ transition:transform .3s ease; }
  .ext-link:hover svg{ transform:translate(2px,-2px); }

  /* ---------- projets ---------- */
  .proj-intro{ color:var(--gris); font-size:15px; max-width:60ch; margin:-24px 0 40px 0; line-height:1.6; }
  .proj-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:28px; }
  @media (max-width:860px){ .proj-grid{ grid-template-columns:1fr; } }
  .proj-card{
    border:1px solid var(--gris-fonce); background:var(--noir-2);
    display:flex; flex-direction:column; overflow:hidden;
    transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1), border-color .4s ease;
  }
  .proj-card.reveal.in:hover{ border-color:var(--bordeaux-clair); transform:translateY(-6px); }
  .proj-media{
    position:relative; aspect-ratio:16/10; overflow:hidden; border-bottom:1px solid var(--gris-fonce);
    background:radial-gradient(ellipse at 50% 0%, rgba(122,17,40,.35), transparent 70%), var(--noir-3);
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .proj-media.fit-cover{ padding:0; }
  .proj-media.light{ background:#ffffff; padding:10px; }
  .proj-media.light img{ filter:none; }
  .proj-media img{
    width:100%; height:100%; object-fit:contain; display:block;
    filter:drop-shadow(0 12px 28px rgba(0,0,0,.55)); transition:transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .proj-media.fit-cover img{ object-fit:cover; object-position:top center; filter:none; }
  .proj-card:hover .proj-media img{ transform:scale(1.02); }
  .proj-placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(122,17,40,.45), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 32px),
      var(--noir-3);
  }
  .ph-mono{ font-family:var(--serif); font-style:italic; font-size:64px; color:var(--bordeaux-clair); line-height:1; }
  .ph-note{ font-size:12px; color:var(--gris); }
  .proj-badge{
    position:absolute; top:14px; left:14px; font-size:12px; color:var(--blanc);
    background:rgba(11,11,12,.78); border:1px solid var(--gris-fonce); padding:6px 11px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .proj-body{ padding:26px 26px 28px; display:flex; flex-direction:column; gap:14px; flex:1; }
  .proj-meta{ font-size:12.5px; color:var(--bordeaux-clair); }
  .proj-body h3{ font-family:var(--serif); font-weight:400; font-size:24px; line-height:1.2; margin:0; }
  .proj-desc{ font-size:14.5px; line-height:1.7; color:var(--texte); margin:0; max-width:62ch; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .proj-tags span{ font-size:12px; color:var(--gris); border:1px solid var(--gris-fonce); padding:5px 10px; }
  .proj-details{ max-height:0; overflow:hidden; opacity:0; transition:max-height .55s cubic-bezier(.2,.7,.2,1), opacity .4s ease; }
  .proj-details.open{ max-height:420px; opacity:1; }
  .proj-details ul{ list-style:none; margin:0; padding:16px 0 4px; border-top:1px solid var(--gris-fonce); display:grid; gap:9px; }
  .proj-details li{ font-size:13.5px; color:var(--texte); line-height:1.6; padding-left:18px; position:relative; }
  .proj-details li::before{ content:'—'; position:absolute; left:0; color:var(--bordeaux-clair); }
  .proj-actions{ margin-top:auto; padding-top:6px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }

  /* projet mis en avant : pleine largeur, image à gauche */
  .proj-card.featured{ grid-column:1 / -1; }
  @media (min-width:1000px){
    .proj-card.featured{ display:grid; grid-template-columns:1.35fr 1fr; }
    .proj-card.featured .proj-media{ aspect-ratio:auto; min-height:420px; padding:30px; border-bottom:none; border-right:1px solid var(--gris-fonce); }
    .proj-card.featured .proj-body{ padding:36px; justify-content:center; }
    .proj-card.featured h3{ font-size:28px; }
  }

  /* ---------- formation ---------- */
  .formation-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start; }
  @media (max-width:760px){ .formation-grid{ grid-template-columns:1fr; } }
  .formation-card{
    border:1px solid var(--gris-fonce); padding:30px; cursor:pointer; text-align:left;
    background:var(--noir-2); color:inherit; font-family:inherit; position:relative;
    transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1), border-color .4s ease, background .4s ease;
  }
  .formation-card.reveal.in:hover{ border-color:var(--bordeaux-clair); transform:translateY(-6px); }
  .formation-card.is-open{ border-color:var(--bordeaux-clair); }
  .formation-card .fc-date{ font-size:12px; color:var(--bordeaux-clair); }
  .formation-card h3{ font-family:var(--serif); font-weight:400; font-size:21px; line-height:1.3; margin:10px 0 6px; }
  .formation-card .fc-school{ color:var(--gris); font-size:14px; margin:0; }
  .fc-details{ max-height:0; overflow:hidden; opacity:0; transition:max-height .5s cubic-bezier(.2,.7,.2,1), opacity .4s ease, margin-top .4s ease; margin-top:0; }
  .formation-card.is-open .fc-details{ max-height:260px; opacity:1; margin-top:20px; }
  .fc-details-inner{ border-top:1px solid var(--gris-fonce); padding-top:16px; }
  .fc-details-inner p{ color:var(--texte); font-size:13.5px; line-height:1.7; margin:0 0 14px 0; }
  .fc-cta{ margin-top:22px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--blanc); }
  .fc-cta .fc-cta-text{ border-bottom:1px solid var(--bordeaux-clair); padding-bottom:2px; }
  .formation-card:hover .fc-cta .fc-cta-text{ color:var(--bordeaux-clair); }

  .certs{ margin-top:48px; display:grid; gap:10px; }
  .cert-row{ display:flex; gap:12px; font-size:14px; color:var(--texte); align-items:flex-start; line-height:1.6; }
  .cert-row .dash{ color:var(--bordeaux-clair); }

  /* ---------- compétences ---------- */
  .domain-row{ display:flex; flex-wrap:wrap; gap:10px; margin:0 0 56px 0; }
  .domain-chip{ font-size:13.5px; padding:9px 15px; border-radius:999px; background:var(--bordeaux); border:1px solid var(--bordeaux); color:var(--blanc-2); }

  .tools-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  @media (max-width:980px){ .tools-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px){ .tools-grid{ grid-template-columns:1fr; } }
  .tool-card{ background:var(--noir-2); border:1px solid var(--gris-fonce); padding:24px; display:flex; flex-direction:column; gap:18px; }
  .tool-card.highlight{ border-color:var(--bordeaux-clair); background:linear-gradient(160deg, rgba(122,17,40,.28), var(--noir-2) 70%); }
  .tool-card.highlight .tool-ico{ background:var(--bordeaux); color:var(--blanc-2); }
  .tool-head{ display:flex; align-items:center; gap:14px; }
  .tool-ico{
    width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center;
    background:rgba(122,17,40,.25); border:1px solid var(--bordeaux); color:var(--bordeaux-clair);
  }
  .tool-head h5{ font-family:var(--serif); font-weight:400; font-size:18px; margin:0; line-height:1.25; }
  .tool-head p{ font-size:12.5px; color:var(--gris); margin:3px 0 0; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    border:1px solid var(--gris-fonce); padding:7px 12px; font-size:13px; color:var(--blanc);
    opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease;
    cursor:default;
  }
  .tag.in{ opacity:1; transform:translateY(0); }

  /* ---------- langues ---------- */
  .langues-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  @media (max-width:700px){ .langues-grid{ grid-template-columns:repeat(2,1fr); } }
  .langue-item{ padding:22px 0; border-top:1px solid var(--gris-fonce); }
  .langue-item .lg-name{ font-family:var(--serif); font-size:22px; }
  .langue-item .lg-level{ font-size:12px; color:var(--bordeaux-clair); margin-top:4px; }
  .langue-item .lg-bar{ height:2px; background:var(--gris-fonce); margin-top:14px; overflow:hidden; }

function useReveal(){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ setInView(true); obs.unobserve(e.target); } });
    }, {threshold:0.15});
    obs.observe(el);
    return ()=>obs.disconnect();
  },[]);
  return [ref, inView];
}

function Reveal({children, className='', delay=0, as='div', ...rest}){
  const [ref,inView] = useReveal();
  const Tag = as;
  const delayClass = delay ? `reveal-delay-${delay}` : '';
  return <Tag ref={ref} className={`reveal ${delayClass} ${inView?'in':''} ${className}`} {...rest}>{children}</Tag>;
}

/* ---------- curseur ---------- */
function Cursor(){
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return;
    let ringX=0, ringY=0, mx=0, my=0;
    const move = e=>{
      mx=e.clientX; my=e.clientY;
      if(dotRef.current){ dotRef.current.style.left=mx+'px'; dotRef.current.style.top=my+'px'; }
    };
    const over = e=>{
      const clickable = e.target.closest && e.target.closest('a, button, [role="button"]');
      document.body.classList.toggle('cursor-hover', !!clickable);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', over);
    let raf;
    const loop = ()=>{
      ringX += (mx-ringX)*0.15; ringY += (my-ringY)*0.15;
      if(ringRef.current){ ringRef.current.style.left=ringX+'px'; ringRef.current.style.top=ringY+'px'; }
      raf = requestAnimationFrame(loop);
    };
    loop();
    return ()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseover',over); cancelAnimationFrame(raf); };
  },[]);
  return <>
    <div id="cursor-dot" ref={dotRef}></div>
    <div id="cursor-ring" ref={ringRef}></div>
  </>;
}

    const vh = window.innerHeight;
    const total = rect.height;
    const visible = Math.min(Math.max(vh*0.75 - rect.top, 0), total);
    setFillHeight((visible/total)*100);
  },[]);
  useEffect(()=>{
    window.addEventListener('scroll', onScroll, {passive:true});

    return ()=>window.removeEventListener('scroll', onScroll);
  },[onScroll]);

function ProjectCard({p, idx}){
  const [imgOk, setImgOk] = useState(true);
  const [ref, inView] = useReveal();
  const mono = p.title.split(' ').filter(w=>w.length>3).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return (
    <article ref={ref} className={`reveal ${inView?'in':''} proj-card ${p.featured?'featured':''}`}>
      <div className={`proj-media ${p.fit==='cover'?'fit-cover':''} ${p.light?'light':''}`}>
        {imgOk
          ? <img src={p.image} alt={`Capture d’écran : ${p.title}`} loading="lazy" onError={()=>setImgOk(false)}/>
          : <div className="proj-placeholder"><span className="ph-mono">{mono}</span><span className="ph-note">Capture d’écran à ajouter</span></div>}
        <span className="proj-badge">{p.badge}</span>
      </div>
      <div className="proj-body">
        <div className="proj-meta">{p.context}, {p.date}</div>
        <h3>{p.title}</h3>
        <p className="proj-desc">{p.desc}</p>
        <div className="proj-tags">{p.tags.map(t=><span key={t}>{t}</span>)}</div>
        {p.link && (
          <div className="proj-actions">
            <a className="ext-link" href={p.link} target="_blank" rel="noopener noreferrer">Voir le projet <ExternalIcon/></a>
          </div>
        )}
      </div>
    </article>
  );
}

function Projets(){
  return (
    <section id="projets">
      <div className="wrap">
        <SecHead num="03" title="Projets réalisés"/>
        <Reveal as="p" className="proj-intro">Une sélection de projets menés en entreprise et à l’université.</Reveal>
        <div className="proj-grid">
          {PROJETS.map((p,i)=><ProjectCard key={i} p={p} idx={i}/>)}
        </div>
      </div>
    </section>
  );
}

/* ---------- formation ---------- */
function FormationCard({f, delay}){
  const [open, setOpen] = useState(false);
  const [ref, inView] = useReveal();
  const delayClass = delay ? `reveal-delay-${delay}` : '';
  return (
    <div
      ref={ref}
      role="button"
      tabIndex={0}
      onClick={()=>setOpen(o=>!o)}
      onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setOpen(o=>!o); } }}
      className={`reveal ${delayClass} ${inView?'in':''} formation-card ${open?'is-open':''}`}
      aria-expanded={open}
    >
      <div className="fc-date">{f.date}</div>
      <h3>{f.title}</h3>
      <p className="fc-school">{f.school}</p>
      <div className="fc-details">
        <div className="fc-details-inner">
          <p>{f.details}</p>
          <a className="ext-link" href={f.link} target="_blank" rel="noopener noreferrer" onClick={(e)=>e.stopPropagation()}>
            Consulter la page officielle de la formation <ExternalIcon/>
          </a>
        </div>
      </div>
      <div className="fc-cta">
        <span className="more-ico" aria-hidden="true">+</span>
        <span className="fc-cta-text">{open ? 'Masquer le détail' : 'Cliquez pour voir le détail'}</span>
      </div>
    </div>
  );
}

function Formation(){
  return (
    <section id="formation">
      <div className="wrap">
        <SecHead num="04" title="Formation"/>
        <div className="formation-grid">
          {FORMATIONS.map((f,i)=>(<FormationCard key={i} f={f} delay={i+1}/>))}
        </div>
        <Reveal delay={2} className="certs">
          <h3 className="sub-label">Certifications</h3>
          {CERTS.map((c,i)=>(
            <div className="cert-row" key={i}><span className="dash">—</span><span>{c}</span></div>
          ))}
        </Reveal>
      </div>
    </section>
  );
}

/* ---------- compétences ---------- */
function ToolIcon({name}){
  const p = {width:20, height:20, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round', 'aria-hidden':true};
  switch(name){
    case 'ml':    return <svg {...p}><circle cx="5" cy="18" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="19" cy="6" r="1.4"/><circle cx="16" cy="9" r="1.4"/><path d="M3 21L21 4"/></svg>;
    case 'chart': return <svg {...p}><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>;
    case 'db':    return <svg {...p}><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>;
    case 'code':  return <svg {...p}><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>;
    case 'web':   return <svg {...p}><rect x="2" y="4" width="20" height="16" rx="1.5"/><path d="M2 9h20M6 6.5h.01M9 6.5h.01"/></svg>;
    case 'stack': return <svg {...p}><path d="M12 2l10 5-10 5L2 7l10-5zM2 12l10 5 10-5M2 17l10 5 10-5"/></svg>;
    default:      return <svg {...p}><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>;
  }
}

function Tag({label, i}){
  const [ref,inView] = useReveal();
  return <span ref={ref} className={`tag ${inView?'in':''}`} style={{transitionDelay:`${i*50}ms`}}>{label}</span>;
}

function Competences(){
  return (
    <section id="competences">
      <div className="wrap">
        <SecHead num="05" title="Compétences"/>

        <Reveal as="h3" className="sub-label">Domaines d’expertise</Reveal>
        <Reveal className="domain-row">
          {DOMAINES.map((d,i)=>(<span className="domain-chip" key={i}>{d.t}</span>))}
        </Reveal>

        <Reveal as="h3" className="sub-label">Outils & technologies</Reveal>
        <div className="tools-grid">
          {OUTILS.map((o,i)=>(
            <Reveal className={`tool-card ${o.highlight?'highlight':''}`} key={i} delay={(i%3)+1}>
              <div className="tool-head">
                <span className="tool-ico"><ToolIcon name={o.icon}/></span>
                <div>
                  <h5>{o.cat}</h5>
                  <p>{o.desc}</p>
                </div>
              </div>
              <div className="tag-row">
                {o.items.map((it,ii)=><Tag key={ii} label={it} i={ii}/>)}
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ---------- langues ---------- */
function LangItem({l}){
  const [ref,inView] = useReveal();
  return (
    <div ref={ref} className={`langue-item ${inView?'in':''}`} style={{'--w':l.w}}>
      <div className="lg-name">{l.name}</div>
      <div className="lg-level">{l.level}</div>
      <div className="lg-bar"><i></i></div>
    </div>
  );
}

function Langues(){
  return (
    <section id="langues">
      <div className="wrap">
        <SecHead num="06" title="Langues"/>
        <div className="langues-grid">
          {LANGUES.map((l,i)=><LangItem key={i} l={l}/>)}
        </div>
      </div>
    </section>
  );
}

/* ---------- témoignages ---------- */
function initials(name){
  return name.replace(/^Pr\.\s*/,'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function Temoignages(){
  const track = [...TEMOIGNAGES, ...TEMOIGNAGES];
  return (
    <section id="temoignages">
      <div className="wrap">
        <SecHead num="07" title="Témoignages"/>
      </div>
      <div className="test-band">
        <div className="test-track">
          {track.map((t,i)=>(
            <div className="test-card" key={i} aria-hidden={i>=TEMOIGNAGES.length}>
              <p className="test-quote">{t.quote}</p>
              <div className="test-who">
                <div className="test-avatar">{initials(t.name)}</div>
                <div>
                  <div className="test-name">{t.name}</div>
                  <div className="test-role">{t.role}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ---------- contact ---------- */
function Contact(){
  return (
    <section id="contact">
      <div className="wrap">
        <SecHead num="08" title="Contact"/>
        <Reveal>
          <h3 className="contact-title">Travaillons<br/>ens<span className="amp">e</span>mble.</h3>
        </Reveal>
        <Reveal delay={2} className="contact-links">
          <a className="contact-link" href={`mailto:${EMAIL}`}>{EMAIL}<span className="under"></span></a>
          <a className="contact-link" href={`tel:${TEL_LIEN}`}>{TEL_AFFICHE}<span className="under"></span></a>
          <a className="contact-link" href={LINKEDIN} target="_blank" rel="noopener noreferrer">LinkedIn<span className="under"></span></a>
        </Reveal>
        <footer>
          <span>Oumaima Boukhalfa — Clichy, Île-de-France</span>
          <span>Portfolio Data Analytics</span>
        </footer>
      </div>
    </section>
  );
}

function App(){
  return (
    <>
      <Cursor/>
      <SideNav/>
      <div className="content-shift">
        <Hero/>
        <Marquee/>
        <Profil/>
        <Experience/>
        <Projets/>
        <Formation/>
        <Competences/>
        <Langues/>
        <Temoignages/>
        <Contact/>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
